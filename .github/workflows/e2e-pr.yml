name: E2E PR Tests

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests on PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Docker Compose
        uses: hoverkraft-tech/compose-action@v2.0.0
        with:
          compose-file: docker-compose.ci.yml
          services: |
            db
            backend

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Wait for Backend Health
        run: |
          echo "Waiting for backend to be ready..."
          max_attempts=30
          attempt=0
          until curl -s http://localhost:8000/health > /dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "Backend failed to start after $max_attempts attempts"
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts - Backend not ready yet, waiting 5 seconds..."
            sleep 5
          done
          echo "Backend is ready!"

      - name: Run E2E Tests
        run: cd frontend && npm run test:e2e

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.head_ref || 'pr' }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Comment PR with Results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'frontend/playwright-report/index.html';
            
            let summary = '## 🎭 E2E Test Results\n\n';
            
            // Leer resultados de tests si existen
            const testResultsPath = 'frontend/test-results.json';
            if (fs.existsSync(testResultsPath)) {
              const results = JSON.parse(fs.readFileSync(testResultsPath, 'utf8'));
              const total = results.stats.expected + results.stats.unexpected + results.stats.skipped;
              const passed = results.stats.expected;
              const failed = results.stats.unexpected;
              const skipped = results.stats.skipped;
              
              const emoji = failed === 0 ? '✅' : '❌';
              summary += `${emoji} **Tests:** ${passed}/${total} passed\n`;
              
              if (failed > 0) {
                summary += `⚠️ **Failed:** ${failed} test(s) failed\n`;
              }
              
              if (skipped > 0) {
                summary += `⏭️ **Skipped:** ${skipped} test(s) skipped\n`;
              }
            } else {
              summary += '⚠️ No se encontraron resultados detallados de tests.\n';
            }
            
            summary += '\n📊 **Reporte completo:** [Ver reporte HTML](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            
            // Buscar comentarios existentes del bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🎭 E2E Test Results')
            );
            
            if (botComment) {
              // Actualizar comentario existente
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              // Crear nuevo comentario
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }

      - name: Stop Docker Compose
        if: always()
        run: docker-compose -f docker-compose.ci.yml down
