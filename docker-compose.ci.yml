version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: idp-ci-db
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=idp_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d idp_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ci-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: idp-ci-backend
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://test:test@db:5432/idp_test
      - SECRET_KEY=test-secret-key-for-ci-only
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ci-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: idp-ci-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=test
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ci-network

networks:
  ci-network:
    driver: bridge
